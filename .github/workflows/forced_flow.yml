name: Forced flow

# Forced-selling event families shaped like L1f (branch line/forced-flow-*). Modes:
#   probe - stage A: announcement titles and archive/mirror probes, no prices
#   run   - stage B: build events, price, apply the locked protocol, keep rows on data/forced-flow
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or run"
        required: true
        default: "probe"

permissions:
  contents: read

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Titles and archive probe
        run: python research/studies/forced_flow_probe.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forced-flow-probe
          path: out/
