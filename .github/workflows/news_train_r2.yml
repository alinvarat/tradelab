name: News train R2

# News-analyst training round 2 (research/news_train/protocol_r2_20261126.md). Claude Haiku 5.5 only, on the owner's Max plan.
#   probe         - GDELT reachability and speed on one day of files (no outcome data)
#   build         - GDELT crypto headlines + S&P 500 8-K items with 1-hour labels -> data/news-train-r2
#   eval          - versions x sets (train, validation) sharded; merged, calibrated on train, scored; selection written
#   analyze       - error analysis of one version on TRAIN only
#   sealed_crypto - ONE-SHOT run of the version in LOCK_R2.json (crypto) on GDELT 2026-08-01..2026-11-26
#   fwd           - scheduled: collect forward S&P 8-Ks, snapshot bars, decide with the locked stock version, count only; scores once
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, build, eval, analyze, sealed_crypto or fwd"
        required: true
        default: "probe"
      versions:
        description: "eval/analyze: comma list of registered versions"
        required: false
        default: "w0"
      sets:
        description: "eval: train, validation or train,validation"
        required: false
        default: "train"
      shards:
        description: "eval: shards per version and set"
        required: false
        default: "8"
  schedule:
    - cron: "40 22 * * 1-5"

permissions:
  contents: read

env:
  TRADELAB_SEC_UA: ${{ secrets.TRADELAB_SEC_UA }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  TRADELAB_CLAUDE_PARALLEL: "4"

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python research/news_train/run_r2.py gdelt_probe out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-probe
          path: out/

  plan_build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as d
          def rng(a, b, step):
              out, t = [], d.date.fromisoformat(a)
              end = d.date.fromisoformat(b)
              while t < end:
                  e = min(t + d.timedelta(days=step), end)
                  out.append({"start": t.isoformat(), "end": e.isoformat()})
                  t = e
              return out
          inc = rng("2025-12-01", "2026-07-01", 10) + rng("2026-08-01", "2026-11-27", 10)
          print("matrix=" + json.dumps({"include": inc}))
          PY

  gdelt:
    needs: plan_build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python research/news_train/run_r2.py gdelt_pull out ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdelt-${{ matrix.start }}
          path: out/

  stock:
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Round-1 data (text cache, scored keys)
        run: |
          mkdir -p /tmp/r1
          git fetch origin data/news-train
          git archive origin/data/news-train | tar -x -C /tmp/r1
      - run: python research/news_train/run_r2.py stock_build out ${{ matrix.shard }} 4 /tmp/r1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-${{ matrix.shard }}
          path: out/

  build_publish:
    needs: [gdelt, stock]
    if: always() && inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: tradelab-news-train-r2-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: gdelt-*
          path: gparts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: stock-*
          path: sparts
          merge-multiple: true
      - run: |
          mkdir -p /tmp/r1 parts
          git fetch origin data/news-train
          git archive origin/data/news-train | tar -x -C /tmp/r1
          python research/news_train/run_r2.py crypto_build gparts parts /tmp/r1
          cp sparts/* parts/
          python research/news_train/run_r2.py publish parts data_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-build
          path: |
            parts/*.json
            data_out/build_report.json
      - name: Keep on data/news-train-r2
        run: |
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r data_out /tmp/keep
          if git fetch origin data/news-train-r2 2>/dev/null; then git checkout -q -B data/news-train-r2 origin/data/news-train-r2
          else git checkout -q --orphan data/news-train-r2 && git rm -rq --cached . && git clean -fdq; fi
          cp -r /tmp/keep/* .
          git add dev.jsonl.gz crypto_sealed_items.jsonl.gz build_report.json
          git commit -qm "News train R2 build: $(date -u +%FT%TZ)" || echo "nothing new"
          for i in 1 2 3 4; do git push -q origin data/news-train-r2 && break; git fetch -q origin data/news-train-r2; git rebase -q origin/data/news-train-r2; done

  plan_eval:
    if: inputs.mode == 'eval'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          vs = [v.strip() for v in "${{ inputs.versions }}".split(",") if v.strip()]
          ss = [s.strip() for s in "${{ inputs.sets }}".split(",") if s.strip()]
          n = int("${{ inputs.shards }}")
          inc = [{"version": v, "set": s, "shard": k, "shards": n} for v in vs for s in ss for k in range(n)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  eval:
    needs: plan_eval
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_eval.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore data
        run: |
          mkdir -p /tmp/data
          git fetch origin data/news-train-r2
          git archive origin/data/news-train-r2 | tar -x -C /tmp/data
      - run: python research/news_train/run_r2.py eval out /tmp/data ${{ matrix.version }} ${{ matrix.set }} ${{ matrix.shard }} ${{ matrix.shards }} 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.version }}-${{ matrix.set }}-${{ matrix.shard }}
          path: out/

  eval_merge:
    needs: eval
    if: always() && inputs.mode == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: tradelab-news-train-r2-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: parts
          merge-multiple: true
      - name: Restore data
        run: |
          mkdir -p /tmp/data
          git fetch origin data/news-train-r2
          git archive origin/data/news-train-r2 | tar -x -C /tmp/data
      - run: python research/news_train/run_r2.py merge parts /tmp/data merged
      - name: Selection on the merged evals
        run: |
          cp -r /tmp/data/evals /tmp/sel_evals 2>/dev/null || true
          mkdir -p sel/evals && cp -r /tmp/sel_evals/. sel/evals/ 2>/dev/null || true
          cp -r merged/evals/. sel/evals/
          python research/news_train/run_r2.py select sel merged
      - name: Spend
        run: python3 -c "import glob,json;t={};[t.__setitem__(k,t.get(k,0)+v) for f in glob.glob('parts/spend_*.json') for k,v in json.load(open(f)).items() if isinstance(v,(int,float))];print('SPEND',json.dumps(t))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-merged
          path: merged/
      - name: Keep on data/news-train-r2
        run: |
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r merged /tmp/keep
          git checkout -q -B data/news-train-r2 origin/data/news-train-r2
          mkdir -p calls evals && cp -r /tmp/keep/calls/. calls/ && cp -r /tmp/keep/evals/. evals/
          cp /tmp/keep/calib.json . && cp /tmp/keep/selection.json .
          git add calls evals calib.json selection.json
          git commit -qm "News train R2 eval ${{ inputs.versions }} ${{ inputs.sets }}: $(date -u +%FT%TZ)" || echo "nothing new"
          for i in 1 2 3 4; do git push -q origin data/news-train-r2 && break; git fetch -q origin data/news-train-r2; git rebase -q origin/data/news-train-r2; done

  analyze:
    if: inputs.mode == 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore data
        run: |
          mkdir -p /tmp/data
          git fetch origin data/news-train-r2
          git archive origin/data/news-train-r2 | tar -x -C /tmp/data
      - run: |
          for v in $(echo "${{ inputs.versions }}" | tr ',' ' '); do python research/news_train/run_r2.py analyze /tmp/data out $v; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-analysis
          path: out/

  sealed_crypto:
    if: inputs.mode == 'sealed_crypto'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    concurrency:
      group: tradelab-news-train-r2-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore data
        run: |
          mkdir -p /tmp/data
          git fetch origin data/news-train-r2
          git archive origin/data/news-train-r2 | tar -x -C /tmp/data
      - run: python research/news_train/run_r2.py sealed_crypto out /tmp/data
        env:
          TRADELAB_CLAUDE_PARALLEL: "6"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-sealed-crypto
          path: out/
      - name: Keep on data/news-train-r2
        run: |
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out/sealed_r2 /tmp/keep_sealed
          git checkout -q -B data/news-train-r2 origin/data/news-train-r2
          mkdir -p sealed_r2 && cp /tmp/keep_sealed/* sealed_r2/
          git add sealed_r2
          git commit -qm "News train R2 SEALED crypto result: $(date -u +%FT%TZ)" || echo "nothing new"
          for i in 1 2 3 4; do git push -q origin data/news-train-r2 && break; git fetch -q origin data/news-train-r2; git rebase -q origin/data/news-train-r2; done

  fwd:
    if: github.event_name == 'schedule' || inputs.mode == 'fwd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: tradelab-news-train-r2-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore data
        run: |
          mkdir -p /tmp/data
          git fetch origin data/news-train-r2
          git archive origin/data/news-train-r2 | tar -x -C /tmp/data
      - run: python research/news_train/run_r2.py fwd out /tmp/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-fwd
          path: out/fwd/progress.json
      - name: Keep on data/news-train-r2
        run: |
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out/fwd /tmp/keep_fwd
          git checkout -q -B data/news-train-r2 origin/data/news-train-r2
          mkdir -p fwd
          [ -f fwd/result.json ] && rm -f /tmp/keep_fwd/result.json
          cp /tmp/keep_fwd/* fwd/
          git add fwd
          git commit -qm "News train R2 forward: $(date -u +%FT%TZ)" || echo "nothing new"
          for i in 1 2 3 4; do git push -q origin data/news-train-r2 && break; git fetch -q origin data/news-train-r2; git rebase -q origin/data/news-train-r2; done
