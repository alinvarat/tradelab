name: Polymarket liquidity-reward quoting (P3)

# Protocol: research/studies/protocol_poly_rewards_20261126.md. Public endpoints only, no keys, no orders.
#   probe   - status and key names of the candidate endpoints
#   measure - reward pools, competition, 147 USD allocation, trade-history replay
#   collect - continuous forward paper tape: ~330 min per run, 1-minute book snapshots + trades, pushed to data/poly-rewards every
#             30 min; it queues its own successor ~10 min before the end (concurrency group keeps it pending: no hole), keeper.yml
#             only restarts the chain when nothing is running or queued. Addendum protocol_poly_rewards_addendum_20261127.md.
#   eval    - recompute the tape verdict from data/poly-rewards
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | measure | collect | eval"
        required: true
        default: "probe"
      minutes:
        description: "collect only: run length in minutes (default 335)"
        required: false
        default: "330"

permissions:
  contents: read

jobs:
  probe:
    if: inputs.mode == 'probe' || inputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python research/studies/poly_rewards.py ${{ inputs.mode }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-rewards-${{ inputs.mode }}
          path: out/

  tape:
    if: inputs.mode == 'collect' || inputs.mode == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: tradelab-poly-rewards-tape
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAPE_PUSH: ${{ github.workspace }}/research/studies/poly_rewards_push.sh
      TAPE_CHAIN: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'collect' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore tape
        run: |
          mkdir -p /tmp/tape
          if git ls-remote --exit-code origin data/poly-rewards >/dev/null 2>&1; then
            git fetch -q origin data/poly-rewards
            git archive origin/data/poly-rewards | tar -x -C /tmp/tape
          fi
      - name: Run
        run: python research/studies/poly_rewards.py ${{ inputs.mode }} /tmp/tape ${{ inputs.minutes }}
      - name: Final push (the run also pushes every 30 minutes)
        if: always() && inputs.mode == 'collect'
        run: |
          [ -f /tmp/tape/state.json ] || exit 0
          bash "$TAPE_PUSH" /tmp/tape
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'eval'
        with:
          name: poly-rewards-eval
          path: /tmp/tape/summary.json
