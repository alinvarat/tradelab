name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradelab-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Test decision log in Chrome
        run: |
          python -m pip install playwright==1.65.2
          python tests/ui_logs_browser.py

  deploy:
    name: Deploy with Kuber
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy
        env:
          KUBER_API_KEY: ${{ secrets.KUBER_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THIRX_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.THIRX_API_KEY }}   # DeepSeek direct wins when its secret exists
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          TRADELAB_SEC_UA: ${{ secrets.TRADELAB_SEC_UA }}
          THIRX_MODEL: ${{ vars.LLM_MODEL || vars.THIRX_MODEL }}
        run: |
          if [ -z "$KUBER_API_KEY" ]; then
            echo "::error::Add the KUBER_API_TOKEN repository secret before deploying."
            exit 1
          fi
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the OPENROUTER_API_KEY repository secret before deploying."
            exit 1
          fi
          if [[ "$OPENROUTER_API_KEY" == *$'\n'* || "$OPENROUTER_API_KEY" == *$'\r'* ]]; then
            echo "::error::OPENROUTER_API_KEY must be a single line."
            exit 1
          fi
          umask 077
          runtime_env="$(mktemp "$RUNNER_TEMP/tradelab-env.XXXXXX")"
          trap 'rm -f -- "$runtime_env"' EXIT
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > "$runtime_env"
          if [ -n "$THIRX_API_KEY" ] && [ -n "$THIRX_MODEL" ]; then     # optional OpenAI-compatible provider for paid calls
            printf 'TRADELAB_LLM_API_KEY=%s\nTRADELAB_LLM_PROVIDER_MODEL=%s\n' "$THIRX_API_KEY" "$THIRX_MODEL" >> "$runtime_env"
            if [ -n "$LLM_BASE_URL" ]; then printf 'TRADELAB_LLM_BASE_URL=%s\n' "$LLM_BASE_URL" >> "$runtime_env"; fi
          fi
          if [ -n "$TRADELAB_SEC_UA" ]; then printf 'TRADELAB_SEC_UA=%s\n' "$TRADELAB_SEC_UA" >> "$runtime_env"; fi
          unset OPENROUTER_API_KEY THIRX_API_KEY TRADELAB_SEC_UA
          export TRADELAB_RUNTIME_ENV_FILE="$runtime_env"
          # Kuber's build step has failed on the platform side ("The request could not be completed") and
          # succeeded on a manual re-run since 2026-11-24. Retry the same command instead of failing the
          # deploy on a transient platform error; a real code error still fails all three attempts.
          for attempt in 1 2 3; do
            if bunx --bun @dmgnr/kuber@2.7.1 ci --trust; then
              exit 0
            fi
            echo "::warning::Deploy attempt ${attempt} of 3 failed; retrying in 60 s."
            sleep 60
          done
          echo "::error::Deploy failed on all 3 attempts."
          exit 1
