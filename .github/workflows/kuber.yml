name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradelab-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

  deploy:
    name: Deploy with Kuber
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy
        env:
          KUBER_API_KEY: ${{ secrets.KUBER_API_TOKEN }}
        run: |
          if [ -z "$KUBER_API_KEY" ]; then
            echo "::error::Add the KUBER_API_TOKEN repository secret before deploying."
            exit 1
          fi
          bunx --bun @dmgnr/kuber@2.7.1 ci --trust
