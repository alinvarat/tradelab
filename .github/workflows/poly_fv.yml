name: Polymarket fair-value family (poly_fv)

# Own workflow so research.yml stays untouched. mode=probe prints the data-availability report;
# later modes (rows shards, summary, forward ledger) are added with the study.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe"
        default: probe

permissions:
  contents: read

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe Polymarket data
        run: python research/studies/poly_fv.py probe --quick | tee probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: poly-fv-probe
          path: probe.json
