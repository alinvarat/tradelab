name: Research studies

# Runs the locked studies in research/news_backtest/protocol_next.md on GitHub's machines (not the owner's).
# Results are uploaded as an artifact; commit them through a PR.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "tom, momentum, items, form4, pit_momentum, llm_earnings, llm_earnings_wide, llm_earnings_forward, llm_8k_other, options_forward, l4f_forward, polymarket_llm or all"
        default: all
  schedule:
    - cron: "0 3 * * 0"        # Sundays 03:00 UTC: forward DeepSeek earnings reader
    - cron: "0 15 * * 1-5"     # weekdays 15:00 UTC: forward options test
    - cron: "17,47 * * * *"    # every 30 min: L4f Polymarket long-shot ledger (Kuber cannot reach Polymarket)

permissions:
  contents: read

jobs:
  forward:
    name: llm_earnings_forward (weekly)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || inputs.study == 'llm_earnings_forward'
    concurrency:
      group: tradelab-forward-earnings-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore the call cache from the data branch
        run: |
          touch /tmp/previous_llm_earnings_forward.json
          if git fetch origin data/llm-earnings 2>/dev/null; then
            git show origin/data/llm-earnings:research/studies/llm_earnings_calls.json > research/studies/llm_earnings_calls.json
            if git cat-file -e origin/data/llm-earnings:research/studies/llm_earnings_forward.json; then
              git show origin/data/llm-earnings:research/studies/llm_earnings_forward.json > /tmp/previous_llm_earnings_forward.json
            fi
          fi

      - name: Run forward study
        env:
          TRADELAB_SEC_UA: ${{ secrets.TRADELAB_SEC_UA }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADELAB_LLM_API_KEY: ${{ secrets.THIRX_API_KEY }}
          TRADELAB_LLM_PROVIDER_MODEL: ${{ vars.THIRX_MODEL }}
        run: |
          python research/studies/run.py llm_earnings_forward --previous-forward-results /tmp/previous_llm_earnings_forward.json \
            --out /tmp/llm_earnings_forward.json > /tmp/llm_earnings_forward_summary.json

      - name: Push cache and results to data/llm-earnings
        run: |
          cp research/studies/llm_earnings_calls.json /tmp/calls.json
          git restore --source=HEAD -- research/studies/llm_earnings_calls.json
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          if git rev-parse --verify -q origin/data/llm-earnings; then
            git checkout -q -B data/llm-earnings origin/data/llm-earnings
          else
            git checkout -q --orphan data/llm-earnings && git rm -rq --cached . && git clean -fdq -e /tmp
          fi
          mkdir -p research/studies
          cp /tmp/calls.json research/studies/llm_earnings_calls.json
          cp /tmp/llm_earnings_forward.json /tmp/llm_earnings_forward_summary.json research/studies/
          git add research/studies/llm_earnings_calls.json research/studies/llm_earnings_forward.json research/studies/llm_earnings_forward_summary.json
          git commit -qm "Forward DeepSeek earnings reader: weekly update $(date -u +%F)" || echo "nothing new"
          git push -q origin data/llm-earnings

  options:
    name: options_forward (weekdays)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1-5') || inputs.study == 'options_forward'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore state
        run: |
          if git fetch origin data/options-forward 2>/dev/null; then
            git show origin/data/options-forward:options_forward_state.json > /tmp/options_forward_state.json
          fi

      - name: Run
        env:
          TRADELAB_SEC_UA: ${{ secrets.TRADELAB_SEC_UA }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADELAB_LLM_API_KEY: ${{ secrets.THIRX_API_KEY }}
          TRADELAB_LLM_PROVIDER_MODEL: ${{ vars.THIRX_MODEL }}
        run: python research/studies/options_forward.py /tmp/options_forward_state.json /tmp/options_forward_summary.json

      - name: Push state to data/options-forward
        if: always()
        run: |
          [ -f /tmp/options_forward_state.json ] || exit 0
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          if git rev-parse --verify -q origin/data/options-forward; then
            git checkout -q -B data/options-forward origin/data/options-forward
          else
            git checkout -q --orphan data/options-forward && git rm -rq --cached . && git clean -fdq
          fi
          cp /tmp/options_forward_state.json .
          [ -f /tmp/options_forward_summary.json ] && cp /tmp/options_forward_summary.json .
          git add options_forward_state.json options_forward_summary.json 2>/dev/null || git add options_forward_state.json
          git commit -qm "Forward options test: $(date -u +%FT%TZ)" || echo "nothing new"
          git push -q origin data/options-forward

  l4f:
    name: l4f_polymarket (every 30 min)
    if: (github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *') || inputs.study == 'l4f_forward'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tradelab-l4f-state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore state
        run: |
          mkdir -p /tmp/l4f
          if git fetch origin data/l4f-forward 2>/dev/null; then
            git show origin/data/l4f-forward:polymarket_longshot_state.json > /tmp/l4f/polymarket_longshot_state.json || true
          fi

      - name: Run
        run: python research/studies/l4f_forward.py /tmp/l4f

      - name: Push state to data/l4f-forward
        if: always()
        run: |
          [ -f /tmp/l4f/polymarket_longshot_state.json ] || exit 0
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          if git rev-parse --verify -q origin/data/l4f-forward; then
            git checkout -q -B data/l4f-forward origin/data/l4f-forward
          else
            git checkout -q --orphan data/l4f-forward && git rm -rq --cached . && git clean -fdq
          fi
          cp /tmp/l4f/polymarket_longshot_state.json /tmp/l4f/l4f_summary.json .
          [ -d /tmp/l4f/ledger_l4f_events ] && mkdir -p ledger && cp -r /tmp/l4f/ledger_l4f_* ledger/ || true
          git add -A polymarket_longshot_state.json l4f_summary.json ledger 2>/dev/null || git add polymarket_longshot_state.json l4f_summary.json
          git commit -qm "L4f ledger: $(date -u +%FT%TZ)" || echo "nothing new"
          git push -q origin data/l4f-forward

  study:
    name: ${{ matrix.study }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        study: [tom, momentum, items, form4, pit_momentum, llm_earnings, llm_earnings_wide, llm_8k_other, probe_options, polymarket_llm, probe_llm_cost, pit_swing, news_v2, l1_listings, l1c_binance_notices, l1e_binance_delist, l1g_alpha_remove, l4_polymarket_longshot, l3_smallcap_news, l6_smallcap_insider, l2_unlocks, probe_provider, news_v3]
    steps:
      - name: Check out repository
        if: inputs.study == 'all' || inputs.study == matrix.study
        uses: actions/checkout@v4

      - name: Set up Python
        if: inputs.study == 'all' || inputs.study == matrix.study
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run study
        if: inputs.study == 'all' || inputs.study == matrix.study
        env:
          TRADELAB_SEC_UA: ${{ secrets.TRADELAB_SEC_UA }}
          TRADELAB_LLM_API_KEY: ${{ (matrix.study == 'probe_provider' || startsWith(matrix.study, 'llm_') || matrix.study == 'polymarket_llm' || matrix.study == 'news_v2' || matrix.study == 'news_v3') && secrets.THIRX_API_KEY || '' }}
          TRADELAB_LLM_PROVIDER_MODEL: ${{ vars.THIRX_MODEL }}
          OPENROUTER_API_KEY: ${{ (startsWith(matrix.study, 'llm_') || matrix.study == 'polymarket_llm' || matrix.study == 'probe_llm_cost' || matrix.study == 'news_v2' || matrix.study == 'news_v3') && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          mkdir -p out
          python research/studies/run.py ${{ matrix.study }} --out out/${{ matrix.study }}.json > out/${{ matrix.study }}_summary.json

      - name: Upload result
        if: always() && (inputs.study == 'all' || inputs.study == matrix.study)
        uses: actions/upload-artifact@v4
        with:
          name: study-${{ matrix.study }}
          path: |
            out/
            research/studies/llm_earnings_calls.json
            research/studies/llm_8k_other_calls.json
          if-no-files-found: warn
