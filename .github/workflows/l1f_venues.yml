name: L1f venues

# Where can the Binance delist-notice coins be shorted (branch line/l1f-short-venues). Modes:
#   probe  - one job per venue (matrix), existence only, hard wall-clock budget, no prices; then a merge job
#   margin - Binance margin evidence (announcements and public endpoints)
#   price  - price the short per venue (locked protocol), reads probe/probe.json from data/l1f-venues
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, margin or price"
        required: true
        default: "probe"

permissions:
  contents: read

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        venue: [binance_um, okx, bybit, bitget, gate, mexc, kucoin_fut, hyperliquid, binance_spot]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Frozen L1f notices (107)
        run: |
          git fetch origin data/forced-flow
          git show origin/data/forced-flow:events/latest.json > /tmp/frozen_events.json
      - name: Probe one venue (45 min budget)
        timeout-minutes: 50
        run: python -u research/studies/l1f_venues.py out probe_venue /tmp/frozen_events.json ${{ matrix.venue }} 2700
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1f-probe-${{ matrix.venue }}
          path: out/
      - name: Keep the part on data/l1f-venues
        if: always()
        run: |
          [ -d out ] && [ "$(ls out)" ] || exit 0
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out /tmp/keep
          for i in 1 2 3 4 5 6; do
            if git fetch origin data/l1f-venues 2>/dev/null; then
              git checkout -q -B data/l1f-venues origin/data/l1f-venues
            else
              git checkout -q --orphan data/l1f-venues && git rm -rq --cached . && git clean -fdq
            fi
            mkdir -p probe/parts && cp /tmp/keep/* probe/parts/
            git add -A probe
            git commit -qm "L1f venues probe part ${{ matrix.venue }}: $(date -u +%FT%TZ)" || break
            git push -q origin data/l1f-venues && break
            sleep $((RANDOM % 8 + 2))
          done

  probe_merge:
    if: always() && inputs.mode == 'probe'
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Merge the parts
        run: |
          git fetch origin data/forced-flow data/l1f-venues
          git show origin/data/forced-flow:events/latest.json > /tmp/frozen_events.json
          mkdir -p /tmp/parts && git archive origin/data/l1f-venues probe/parts | tar -x -C /tmp/parts
          python -u research/studies/l1f_venues.py out probe_merge /tmp/frozen_events.json /tmp/parts/probe/parts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1f-probe-merged
          path: out/
      - name: Keep probe.json on data/l1f-venues
        run: |
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out /tmp/keep
          git checkout -q -B data/l1f-venues origin/data/l1f-venues
          mkdir -p probe && cp /tmp/keep/probe.json probe/probe.json
          git add -A probe
          git commit -qm "L1f venues probe merged: $(date -u +%FT%TZ)" || echo "nothing new"
          for i in 1 2 3 4; do git push -q origin data/l1f-venues && break; git fetch -q origin data/l1f-venues; git rebase -q origin/data/l1f-venues; done

  margin:
    if: inputs.mode == 'margin'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -u research/studies/l1f_venues.py out margin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1f-venues-margin
          path: out/
      - name: Keep on data/l1f-venues
        if: always()
        run: |
          [ -d out ] && [ "$(ls out)" ] || exit 0
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out /tmp/keep
          for i in 1 2 3 4 5 6; do
            if git fetch origin data/l1f-venues 2>/dev/null; then
              git checkout -q -B data/l1f-venues origin/data/l1f-venues
            else
              git checkout -q --orphan data/l1f-venues && git rm -rq --cached . && git clean -fdq
            fi
            mkdir -p margin && cp /tmp/keep/* margin/
            git add -A margin
            git commit -qm "L1f venues margin: $(date -u +%FT%TZ)" || break
            git push -q origin data/l1f-venues && break
            sleep $((RANDOM % 8 + 2))
          done

  price:
    if: inputs.mode == 'price'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          git fetch origin data/forced-flow data/l1f-venues
          git show origin/data/forced-flow:events/latest.json > /tmp/frozen_events.json
          git show origin/data/l1f-venues:probe/probe.json > /tmp/probe.json
      - run: python -u research/studies/l1f_venues.py out price /tmp/frozen_events.json /tmp/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1f-venues-price
          path: out/
      - name: Keep on data/l1f-venues
        if: always()
        run: |
          [ -d out ] && [ "$(ls out)" ] || exit 0
          git config user.name tradelab-research
          git config user.email tradelab-research@users.noreply.github.com
          cp -r out /tmp/keep
          for i in 1 2 3 4 5 6; do
            git fetch origin data/l1f-venues && git checkout -q -B data/l1f-venues origin/data/l1f-venues
            d=price/$(date -u +%Y%m%dT%H%M%SZ); mkdir -p $d && cp /tmp/keep/* $d/
            git add -A price
            git commit -qm "L1f venues price: $(date -u +%FT%TZ)" || break
            git push -q origin data/l1f-venues && break
            sleep $((RANDOM % 8 + 2))
          done
